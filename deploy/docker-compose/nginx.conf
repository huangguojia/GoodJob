map $http_x_forwarded_proto $goodjob_forwarded_proto {
    default $http_x_forwarded_proto;
    "" $scheme;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 12m;

    location = /container-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location ^~ /whatsapp-plugin/api/ {
        proxy_pass http://communication:3100/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $goodjob_forwarded_proto;
        proxy_set_header Cookie $http_cookie;
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /whatsapp-plugin/socket.io {
        proxy_pass http://communication:3100/socket.io;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $goodjob_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    location = /whatsapp-plugin {
        return 302 /whatsapp-plugin/;
    }

    location = /whatsapp-plugin/ {
        try_files /whatsapp-plugin/index.html =404;
        add_header Cache-Control "no-store";
    }

    location ^~ /whatsapp-plugin/ {
        try_files $uri /whatsapp-plugin/index.html;
    }

    location = /api {
        proxy_pass http://backend:4188/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $goodjob_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /api/ {
        proxy_pass http://backend:4188/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $goodjob_forwarded_proto;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location ^~ /uploads/ {
        proxy_pass http://backend:4188/uploads/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $goodjob_forwarded_proto;
        proxy_read_timeout 60s;
        add_header Cache-Control "private, max-age=300";
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }
}
