<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Linux / 容器里的 fontconfig，给 LibreOffice 无头转换用。

  为什么单独一份、不共用 macOS 那份：
  fonts.conf 里的 <dir> 是「字体目录白名单」。把 macOS 的 /System/Library/Fonts 塞进
  Linux 容器，等于告诉 fontconfig「系统里一个字体都没有」——转换会「成功」，但版面全空。
  所以两份配置按平台分开，由 file-derive.ts 的 fontConfigFile() 选择。

  另一个坑是字体名映射：.docx 里写的是「宋体 / SimSun」「微软雅黑 / Microsoft YaHei」，
  这些名字在 Linux 上不存在。不配 alias 时 LibreOffice 会退到无中文字形的字体，
  中文整段消失。这里把它们绑到 Noto CJK / 文泉驿上。
  binding="same" 表示「同一个字体」而不是「优先尝试」，能避免 fallback 顺序被覆盖。
-->
<fontconfig>
  <dir>/usr/share/fonts</dir>
  <dir>/usr/local/share/fonts</dir>
  <dir prefix="xdg">fonts</dir>
  <dir>~/.fonts</dir>
  <dir>~/.local/share/fonts</dir>
  <cachedir>/tmp/goodjob-fontconfig-cache</cachedir>

  <alias binding="same"><family>宋体</family><prefer><family>Noto Serif CJK SC</family><family>AR PL UMing CN</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>Noto Serif CJK SC</family><family>AR PL UMing CN</family></prefer></alias>
  <alias binding="same"><family>新宋体</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>NSimSun</family><prefer><family>Noto Serif CJK SC</family></prefer></alias>

  <alias binding="same"><family>黑体</family><prefer><family>Noto Sans CJK SC</family><family>WenQuanYi Zen Hei</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>Noto Sans CJK SC</family><family>WenQuanYi Zen Hei</family></prefer></alias>
  <alias binding="same"><family>微软雅黑</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>等线</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>
  <alias binding="same"><family>DengXian</family><prefer><family>Noto Sans CJK SC</family></prefer></alias>

  <alias binding="same"><family>楷体</family><prefer><family>AR PL UKai CN</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>KaiTi</family><prefer><family>AR PL UKai CN</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>仿宋</family><prefer><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></prefer></alias>
  <alias binding="same"><family>FangSong</family><prefer><family>AR PL UMing CN</family><family>Noto Serif CJK SC</family></prefer></alias>

  <!-- 英文衬线/无衬线兜底：Calibri 是 Office 默认，Linux 上没有 -->
  <alias binding="same"><family>Calibri</family><prefer><family>Carlito</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Cambria</family><prefer><family>Caladea</family><family>DejaVu Serif</family></prefer></alias>
  <alias binding="same"><family>Arial</family><prefer><family>Liberation Sans</family><family>DejaVu Sans</family></prefer></alias>
  <alias binding="same"><family>Times New Roman</family><prefer><family>Liberation Serif</family><family>DejaVu Serif</family></prefer></alias>
</fontconfig>
