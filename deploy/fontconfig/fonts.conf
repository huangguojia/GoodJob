<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  GoodJob 文档预览用 fontconfig

  背景：LibreOffice 在 macOS 上默认只认自己 bundle 里的字体（128 个，无中日韩字形），
  不扫描系统字体目录。结果是转出来的 PDF 里**中文整段消失**，只剩数字和英文——
  这比转失败更危险，因为看起来像成功了。

  解决：显式声明字体目录 + 把 Office/WPS 文档里常见的中文字体名映射到本机实际存在的字体。
  后端通过 FONTCONFIG_FILE / FONTCONFIG_PATH 把本文件喂给 soffice 子进程（见 file-derive.ts）。

  优先级说明：
  - 各 alias 的 prefer 里第一个是 WPS 自带字体（书宋/汉仪旗黑），它比 macOS 的
    STHeiti 更接近宋体的字宽，转换后的分页更贴近原稿；WPS 未装时自动退到系统字体。
  - 想 100% 还原版式，需要真正的 SimSun/SimHei 字体文件；把字体装进系统后
    在 prefer 里提到最前面即可。
-->
<fontconfig>
  <!-- 系统字体 -->
  <dir>/System/Library/Fonts</dir>
  <dir>/System/Library/Fonts/Supplemental</dir>
  <dir>/Library/Fonts</dir>
  <dir prefix="xdg">fonts</dir>

  <!-- WPS Office 自带中文字体（只引用不复制）；未安装 WPS 时该目录不存在，fontconfig 会忽略 -->
  <dir>/Applications/wpsoffice.app/Contents/Resources/office6/fonts</dir>

  <!-- 缓存目录必须可写，否则每次转换都要重建索引 -->
  <cachedir>/tmp/goodjob-fontconfig-cache</cachedir>

  <!-- 宋体族 -->
  <alias binding="same"><family>宋体</family><prefer><family>ShuS-SC</family><family>Songti SC</family><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>SimSun</family><prefer><family>ShuS-SC</family><family>Songti SC</family><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>新宋体</family><prefer><family>ShuS-SC</family><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>NSimSun</family><prefer><family>ShuS-SC</family><family>Songti SC</family></prefer></alias>
  <alias binding="same"><family>STSong</family><prefer><family>Songti SC</family></prefer></alias>

  <!-- 黑体族 -->
  <alias binding="same"><family>黑体</family><prefer><family>HYQiHei-55J</family><family>STHeiti</family><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>SimHei</family><prefer><family>HYQiHei-55J</family><family>STHeiti</family><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>STHeiti</family><prefer><family>HYQiHei-55J</family><family>Heiti SC</family></prefer></alias>

  <!-- 微软雅黑 / 等线 -->
  <alias binding="same"><family>微软雅黑</family><prefer><family>HYZhongJianHeiJ</family><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>Microsoft YaHei</family><prefer><family>HYZhongJianHeiJ</family><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>等线</family><prefer><family>HYZhongJianHeiJ</family><family>Hiragino Sans GB</family></prefer></alias>
  <alias binding="same"><family>DengXian</family><prefer><family>HYZhongJianHeiJ</family><family>Hiragino Sans GB</family></prefer></alias>

  <!-- 楷体 / 仿宋 -->
  <alias binding="same"><family>楷体</family><prefer><family>HYKaiTiJ</family><family>Kaiti SC</family></prefer></alias>
  <alias binding="same"><family>KaiTi</family><prefer><family>HYKaiTiJ</family><family>Kaiti SC</family></prefer></alias>
  <alias binding="same"><family>仿宋</family><prefer><family>FangS-SC</family></prefer></alias>
  <alias binding="same"><family>FangSong</family><prefer><family>FangS-SC</family></prefer></alias>

  <!-- 兜底：任何没匹配上的字体名，也别让中文掉字形 -->
  <alias binding="same"><family>sans-serif</family><prefer><family>Hiragino Sans GB</family><family>STHeiti</family></prefer></alias>
  <alias binding="same"><family>serif</family><prefer><family>Songti SC</family><family>Hiragino Sans GB</family></prefer></alias>
</fontconfig>
