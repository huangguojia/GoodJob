<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>扫码测试</title>
    <style>
        body { font-family: Arial; max-width: 600px; margin: 50px auto; padding: 20px; }
        button { padding: 10px 20px; margin: 10px 0; }
        #status { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 8px; }
        #qrContainer { min-height: 250px; display: flex; align-items: center; justify-content: center; border: 2px dashed #ddd; margin: 20px 0; }
        .error { background: #fee; color: #c00; }
        .success { background: #efe; color: #060; }
    </style>
</head>
<body>
    <h1>WhatsApp 扫码测试</h1>
    
    <div>
        <button onclick="login()">1. 登录</button>
        <button onclick="startScan()">2. 开始扫码</button>
    </div>

    <div id="status">等待操作...</div>
    <div id="qrContainer">二维码将显示在这里</div>
    
    <div id="log" style="background:#f5f5f5;padding:10px;max-height:300px;overflow-y:auto;font-family:monospace;font-size:12px;"></div>

    <script>
        const API = 'http://127.0.0.1:4188';
        
        function log(msg) {
            const logDiv = document.getElementById('log');
            const time = new Date().toLocaleTimeString();
            logDiv.innerHTML += `[${time}] ${msg}<br>`;
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function login() {
            log('发送登录请求...');
            try {
                const res = await fetch(`${API}/api/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: 'shirley@goodjob.com',
                        password: 'goodjob123'
                    }),
                    credentials: 'include'
                });
                const data = await res.json();
                if (data.user) {
                    document.getElementById('status').className = 'success';
                    document.getElementById('status').textContent = `✓ 登录成功: ${data.user.name}`;
                    log(`登录成功: ${data.user.name}`);
                } else {
                    throw new Error(data.message || '登录失败');
                }
            } catch (e) {
                document.getElementById('status').className = 'error';
                document.getElementById('status').textContent = `✗ 登录失败: ${e.message}`;
                log(`登录失败: ${e.message}`);
            }
        }

        async function startScan() {
            log('开始扫码绑定...');
            const qrContainer = document.getElementById('qrContainer');
            qrContainer.innerHTML = '⏳ 正在初始化...';

            try {
                const res = await fetch(`${API}/api/whatsapp/binding/web-scan/start`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ customerId: 'c1' }),
                    credentials: 'include'
                });
                
                const data = await res.json();
                log(`启动响应: ${JSON.stringify(data)}`);

                if (data.clientId) {
                    document.getElementById('status').className = 'success';
                    document.getElementById('status').textContent = `✓ 启动成功，ClientID: ${data.clientId}`;
                    log(`ClientID: ${data.clientId}`);
                    
                    // 连接 SSE 获取二维码
                    connectQR(data.clientId);
                } else {
                    throw new Error(data.message || '启动失败');
                }
            } catch (e) {
                document.getElementById('status').className = 'error';
                document.getElementById('status').textContent = `✗ 启动失败: ${e.message}`;
                log(`启动失败: ${e.message}`);
                qrContainer.innerHTML = `<p style="color:red">启动失败: ${e.message}</p>`;
            }
        }

        function connectQR(clientId) {
            log(`连接 SSE: /api/whatsapp/binding/web-scan/qr/${clientId}`);
            const qrContainer = document.getElementById('qrContainer');
            qrContainer.innerHTML = '⏳ 正在生成二维码...';

            try {
                const eventSource = new EventSource(`${API}/api/whatsapp/binding/web-scan/qr/${clientId}`);
                
                eventSource.onopen = () => {
                    log('SSE 连接已打开');
                };

                eventSource.onmessage = (event) => {
                    log(`收到消息: ${event.data}`);
                    const data = JSON.parse(event.data);

                    if (data.qr) {
                        log('收到二维码数据');
                        qrContainer.innerHTML = `
                            <div style="text-align:center">
                                <img src="https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(data.qr)}" 
                                     alt="QR Code" style="display:block;margin:0 auto;border:1px solid #ccc" />
                                <p style="margin-top:10px;color:#666">请使用 WhatsApp 扫描此二维码</p>
                            </div>
                        `;
                    }

                    if (data.timeout) {
                        log('二维码超时');
                        eventSource.close();
                        qrContainer.innerHTML = `<p style="color:#f80">二维码已过期，请重新开始</p>`;
                    }
                };

                eventSource.onerror = (e) => {
                    log(`SSE 错误: ${e.type}`);
                    eventSource.close();
                    qrContainer.innerHTML = `<p style="color:red">连接失败，请重试</p>`;
                };

                // 30秒超时
                setTimeout(() => {
                    log('手动超时关闭');
                    eventSource.close();
                }, 35000);

            } catch (e) {
                log(`连接异常: ${e.message}`);
                qrContainer.innerHTML = `<p style="color:red">加载二维码失败: ${e.message}</p>`;
            }
        }

        log('页面加载完成');
    </script>
</body>
</html>
